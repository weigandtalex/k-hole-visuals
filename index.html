<style>
/* Layout: picture on top, a rack of four rule devices below (side by side on wide screens). Single dark look by choice. */
:root{
  --void:#05070d;
  --rack:#0b0f18;
  --ice:#d3e6f4;
  --haze:#8497b4;
  --violet:#a08ce6;
  --line:rgba(211,230,244,.18);

  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;

  --c:var(--s0);
  --k0:#34d399;--k1:#3b9dff;--k2:#22d3ee;--k3:#b4e33d;--k4:#7c83ff;--k5:#14b8a6;--k6:#a78bfa;--k7:#86efac;--cr:#ffd21f;--cd:#ff8a3d;
  --red:#ff5a5a;--green:#6fdc8c;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ice);font-family:var(--mono);font-size:12px;overflow:hidden}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
#mk{position:absolute;box-sizing:border-box;border:2px dashed #fff;box-shadow:0 0 0 1px rgba(0,0,0,.7),0 0 12px var(--mkc,#fff),inset 0 0 12px var(--mkc,#fff);pointer-events:none;z-index:3}
#view{position:relative;flex:1 1 42%;min-height:36%;background:#000;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#pg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#pg circle{fill:var(--th,var(--violet));stroke:var(--void);stroke-width:2}
#pg path{fill:rgba(211,230,244,.08);stroke:var(--ice);stroke-width:1.5;stroke-dasharray:5 4}
#pg circle.cur{stroke:var(--ice);stroke-width:3}
#pgr{position:absolute;width:132px;height:32px;padding:0 10px;background:rgba(5,7,13,.78);border:1px solid var(--line)}
#note{position:absolute;left:16px;right:16px;bottom:10px;color:var(--haze);letter-spacing:.06em;text-shadow:0 0 10px var(--void);pointer-events:none}
#panel{flex:0 1 auto;max-height:58%;overflow-y:auto;background:var(--rack);border-top:1px solid var(--line);padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));padding-inline:16px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar > *{min-width:0}
button,.file{font-family:var(--mono);font-size:12px;color:var(--ice);background:transparent;border:1px solid var(--line);padding:9px 12px;letter-spacing:.05em;cursor:pointer;border-radius:0;white-space:nowrap}
button:hover,.file:hover{border-color:var(--ice)}
.file{background:var(--ice);color:var(--void);border-color:var(--ice);font-weight:500;flex:1 1 auto;text-align:center}
.file input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
button[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--void)}
#bpm{font-family:var(--mono);font-size:12px;width:64px;background:transparent;color:var(--ice);border:1px solid var(--line);padding:9px 8px;font-variant-numeric:tabular-nums;border-radius:0}
.dim{color:var(--haze);letter-spacing:.06em}
.dev{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.dev h2{margin:0 0 4px;font-family:var(--display);font-weight:300;font-size:13px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.dev h2 input{width:15px;height:15px;accent-color:var(--violet);margin:0}
.dev.off .sl{opacity:.35}
.sl{-webkit-user-select:none;user-select:none;display:grid;grid-template-columns:58px 28px minmax(0,1fr) 28px 28px 50px 28px;align-items:center;gap:5px;color:var(--haze);min-height:34px}
.sl .st,.sl .rb,.sl .db{padding:0;width:28px;height:30px;text-align:center;letter-spacing:0}
.sl .db{font-size:11px;color:var(--haze)}
.sl .db:disabled{opacity:.3;cursor:default}
.sl .db[aria-pressed="true"]{color:var(--void);background:var(--cd);border-color:var(--cd)}
.cgrp{border:1px solid var(--line);padding:8px 8px 2px;margin:10px -9px 6px}.cgt{font-size:11px;color:var(--haze);letter-spacing:.08em;margin-bottom:4px}
output.pb.dc.rg1{font-size:8px;letter-spacing:-.3px;padding-left:1px;padding-right:1px}output.pb.dc.rg1::after{margin-left:1px}
.sl output.two{font-size:10px;line-height:1.25;white-space:pre-line}
.rg{position:relative;height:28px;min-width:0}
.rg input{position:absolute;left:0;top:0;width:100%}
.rg input.lo,.rg input.hi{pointer-events:none}
.rg input.lo::-webkit-slider-thumb,.rg input.hi::-webkit-slider-thumb{pointer-events:auto;width:8px}
.rg input.lo::-moz-range-thumb,.rg input.hi::-moz-range-thumb{pointer-events:auto;width:8px}
.rg input.act::-webkit-slider-thumb{box-shadow:0 0 0 2px var(--ice)}
.rg input.act::-moz-range-thumb{box-shadow:0 0 0 2px var(--ice)}
.rg input.hi::-webkit-slider-runnable-track{background:transparent}
.rg input.hi::-moz-range-track{background:transparent}
.sl.auto .rg input.lo,.sl.auto .rg input.hi{opacity:1}
#reset{padding:7px 12px;color:var(--red);font-weight:500;flex:0 0 auto}
.sl .rb{font-size:11px;color:var(--haze)}
.sl .rb[aria-pressed="true"],.slots button.rcnt[aria-pressed="true"],#rand[aria-pressed="true"],#rand{color:var(--void);background:var(--cr);border-color:var(--cr)}
.sl.auto input[type=range],.sl.auto .dial{opacity:.4}
.dialwrap{display:grid;place-items:center;padding:4px 0}
.dial{width:60px;height:60px;border:1px solid var(--th,var(--ice));border-radius:50%;position:relative;touch-action:none;cursor:pointer}
.needle{position:absolute;left:50%;top:50%;width:2px;height:28px;margin:-28px 0 0 -1px;background:var(--th,var(--violet));transform-origin:50% 100%}
.sl output{color:var(--ice);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
output.pb{font-size:10px;border:1px solid var(--ice);border-radius:6px;padding:4px 2px;cursor:pointer;text-align:center;user-select:none;-webkit-user-select:none}
output.pb::after{content:attr(data-n);opacity:.85}
output.pb.dc{min-width:54px;white-space:nowrap;box-sizing:border-box}output.pb.dc::after{content:"rev";margin-left:3px;font-size:8px;font-weight:700;letter-spacing:0;opacity:.25}output.pb.dc[data-rev="1"]::after{opacity:1;color:var(--red);text-shadow:0 0 5px var(--red)}output.pb.dc[data-rev="x"]::after{opacity:0}output.pb.dc[data-rev="2"]::after{content:'rev\2009r';font-size:7px;letter-spacing:-.4px;margin-left:2px;opacity:1;color:var(--cr);text-shadow:0 0 5px var(--cr)}
.sl label.hzb{text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
input[type=range]{touch-action:pan-y;-webkit-user-drag:none;-webkit-appearance:none;appearance:none;background:transparent;height:28px;width:100%;min-width:0;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
input[type=range]::-moz-range-track{height:1px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-6px;background:var(--th,var(--ice));border:0;border-radius:0}
input[type=range]::-moz-range-thumb{width:13px;height:13px;background:var(--th,var(--ice));border:0;border-radius:0}
button:focus-visible,input:focus-visible,.file:focus-within{outline:1px solid var(--violet);outline-offset:2px}
.slots{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;margin:2px 0 6px}
.slots button{padding:9px 0;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:0}
.slots button.on,.slots button.on[aria-pressed="true"]{background:var(--k,var(--violet));border-color:var(--k,var(--violet));color:var(--void);font-weight:500}
.slots{align-items:stretch}
.slots button.am{font-size:11px;color:var(--haze)}
.slots button.man{border-color:var(--ice)}
.cs{display:flex;flex-direction:column;border:1px solid var(--line);border-color:color-mix(in srgb,var(--k) 35%,var(--rack));background:color-mix(in srgb,var(--k) 14%,var(--rack))}
.cs button,.cs button[aria-pressed="true"]{border:0;background:transparent;color:var(--haze);color:color-mix(in srgb,var(--k) 65%,var(--rack));padding:9px 0;text-align:center;letter-spacing:0}
.cs .dot,.cs .dot[aria-pressed="true"]{padding:3px 0;margin:2px 4px 5px;border-radius:3px;color:var(--red);font-size:9px;line-height:1.2;font-weight:500}
.cs.on{background:var(--k);border-color:var(--k)}
.cs.on button,.cs.on button[aria-pressed="true"]{color:var(--void);font-weight:500}
.cs.on .dot,.cs.on .dot[aria-pressed="true"]{color:#04591f;font-weight:700;text-shadow:0 0 4px #d6ffe4,0 0 2px #d6ffe4}
.cs.sel{outline:2px solid var(--ice);outline-offset:2px}
.slots button.idle{opacity:.3}
.slots button.am.man{color:var(--ice)}
.slots button.am.sel{color:var(--void)}
.tip{color:var(--haze);line-height:1.5;margin:0 0 4px}
.mark{position:absolute;transform:translate(-50%,-50%);min-width:20px;padding:2px 4px;text-align:center;background:var(--void);border:1px solid var(--ice);color:var(--ice);font-variant-numeric:tabular-nums;pointer-events:none}
.mark.sel{background:var(--violet);border-color:var(--violet);color:var(--void)}
.srcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.src{position:relative;aspect-ratio:4/3}
.src .pic{position:absolute;inset:0;width:100%;height:100%;padding:0;overflow:hidden}
.src .th{position:absolute;inset:0;background-size:cover;background-position:center;display:grid;place-items:center;color:var(--haze);font-size:20px}
.src.idle .th{opacity:.28}
.src .n,.src .x{position:absolute;top:0;width:34px;height:34px;padding:0;text-align:center;font-size:14px;letter-spacing:0;background:var(--rack);color:var(--haze)}

.src .cam.live{color:var(--red);animation:camb 1s steps(2) infinite}@keyframes camb{50%{opacity:.35}}
.src .x.clip{color:var(--red);font-size:16px}.src .x.clip.rec{background:var(--red);color:var(--void);animation:camb 1s steps(2) infinite}
.src .flip{position:absolute;right:0;bottom:0;width:38px;height:34px;padding:0;text-align:center;font-size:18px;font-weight:700;letter-spacing:0;background:var(--rack);color:var(--ice)}
#rec{color:var(--red);font-weight:700;padding:9px 8px}#rec[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--void)}

#app.ctl .pcl #view{flex:0 0 auto;width:100%;min-height:0;border:1px solid var(--line)}
#app.ctl .pcl #note{display:none}
#app.ctl .pcc{justify-content:flex-start}
#app.ctl #gph{font-size:12px}
#app.ctl .pushsvg{max-width:none;width:100%;max-height:calc(100vh - 330px)}
#app.ctl .gptabs button{padding:8px 4px}
#gp[aria-pressed="true"]{color:var(--void);background:var(--cr);border-color:var(--cr)}
#gph{font-size:11px;color:var(--haze);padding:6px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#gph b{color:var(--cr);font-weight:500}
#gph .gpt{width:100%}
.gpsvg{width:100%;max-width:440px;display:block;margin:2px auto;font-family:inherit}
.gpbody{fill:#0c111c;stroke:#2a3346;stroke-width:1.5}
.gpk{cursor:pointer}.gpk rect,.gpk circle{fill:#151c2b;stroke:#3a4560;stroke-width:1}
.gpk circle.gpwell{fill:#080b12}
.gpk.on rect,.gpk.on circle:not(.gpwell){fill:#3a3410;stroke:var(--cr)}
.gpk.pr rect,.gpk.pr circle:not(.gpwell){fill:#fff;stroke:#fff}
.gpsym{fill:var(--haze);font-size:10px;pointer-events:none}.gpk.pr .gpsym{fill:#000}
.gpcap{fill:var(--cr);font-size:9.5px;pointer-events:none}
.gpinf{width:100%;font-size:11px;line-height:1.7}.gpinf i{font-style:normal;display:inline-block;min-width:15px;height:15px;line-height:15px;text-align:center;border-radius:8px;background:var(--cr);color:#000;font-size:9px}
.gpw{opacity:.6}.gptabs{display:flex;gap:6px;width:100%}
.gppre{display:flex;gap:5px;align-items:center;width:100%;flex-wrap:wrap}.gppre .dim{font-size:11px;margin-right:2px}.gppre button{padding:5px 8px;min-width:30px}
.gppre .pn.full{border-color:var(--cr);color:var(--cr)}.gppre button[aria-pressed="true"],.gppre .pn.full[aria-pressed="true"]{color:var(--void);background:var(--cr);border-color:var(--cr)}
.gplow{display:flex;gap:12px;width:100%;align-items:flex-start}.gpsmall{flex:0 0 38%;max-width:240px}.gpsmall .gpsvg{max-width:100%}.gplow .gpinf{flex:1;min-width:0}.gptabs button{flex:1;padding:6px 4px}.gptabs button[aria-pressed="true"]{color:var(--void);background:var(--cr);border-color:var(--cr)}
.pushsvg{max-width:560px}.pdisp{fill:#000;stroke:#2a3346}.gpsym.ps{font-size:7px}.pstrip{fill:var(--haze);pointer-events:none}
.pbadge circle{fill:var(--cr)}.pbadge text{fill:#000;font-size:8px;font-weight:600;pointer-events:none}.pbadge{pointer-events:none}.gpinf button{padding:1px 6px;font-size:10px;margin-left:4px}
.gpl .sl,.gpl #glob button,.gpl .bar button{outline:1px dashed rgba(255,255,255,.18);outline-offset:1px}
.gpsel{outline:2px solid var(--cr)!important;outline-offset:1px}
.gpb{box-shadow:inset 0 -2px 0 var(--cr)}
</style>
</head>
<body>

<div id="app">
  <div id="view">
    <canvas id="c" aria-label="Картинка, которую правила режут на прямоугольники"></canvas>
    <div id="mk" hidden></div>
    <svg id="pg" hidden aria-label="Контур своей формы: тяни точки, двойное касание добавляет или убирает точку"></svg>
    <input id="pgr" type="range" min="0" max="100" value="0" hidden aria-label="Скругление выбранного угла">
    <div id="note">демо-сцена · нажми + в ячейке, чтобы добавить фото или видео</div>
  </div>
  <div id="split" role="separator" aria-orientation="vertical" title="Тяни влево — панель шире (лампы и звук встанут рядом). Двойной клик — обычная ширина"></div>
  <div id="panel">
    <div id="srcs" class="srcs" role="group" aria-label="Восемь картинок"></div>
    <div class="bar top">
      <label class="file" hidden aria-label="Добавить фото или видео">+ Файл<input id="file" type="file" accept="image/*,video/*"></label>
      <button id="play" type="button" aria-label="Пауза">❚❚</button>
      <span class="bpm"><input id="bpm" type="number" min="40" max="240" value="120" inputmode="numeric" aria-label="Темп, ударов в минуту"><span class="ud"><button id="bpmup" type="button" aria-label="Темп выше">▴</button><button id="bpmdn" type="button" aria-label="Темп ниже">▾</button></span></span>
      <span class="dim">BPM</span>
      <button id="tap" type="button">Тап</button>
      <button id="rec" type="button" hidden aria-pressed="false" aria-label="Записать видео">● REC</button>
      <button id="full" type="button" aria-label="Во весь экран">⛶</button>
      <button id="out" type="button" aria-pressed="false" title="Картинка — в отдельное окно на второй экран" aria-label="Вывести картинку на второй экран">⧉</button>
      <button id="pxbtn" type="button" aria-pressed="false" title="Пиксели — LED / мозаика / штрихи: открыть настройки">▦</button>
      <button id="gp" type="button" aria-pressed="false" aria-label="Геймпад: привязать управление">🎮</button>
    </div>
    <div id="gph" hidden></div>
    <div id="glob"></div>
    <div id="lamp" class="lampbox" role="group" aria-label="Лампа по Bluetooth"></div>
    <div class="bar" id="srcbar" hidden>
      <span id="srchead">демо-сцена</span>
    </div>

    <div id="rack"></div>
    <div id="tools">
      <div class="bar pre" role="group" aria-label="Настройки открытого номера">
        <span class="dim">Номер</span>
        <button id="ucopy" type="button">Copy</button>
        <button id="upaste" type="button" disabled>Paste</button>
        <button id="uall" type="button">All №</button>
      </div>
      <div class="bar pre" role="group" aria-label="Настройки всей картинки">
        <span class="dim">Картинка</span>
        <button id="pcopy" type="button">Copy</button>
        <button id="ppaste" type="button" disabled>Paste</button>
        <button id="pall" type="button">All pics</button>
      </div>
      <div class="bar pre bank" id="bank" role="group" aria-label="Банк пресетов">
        <span class="dim">Банк</span>
        <button id="bsave" type="button" aria-pressed="false">Save</button>
      </div>
      <div class="bar pre">
        <button id="rand" type="button" aria-pressed="false">All random</button>
        <span class="rs2"><button id="resetall" type="button">All Reset</button><button id="reset" type="button">Reset</button></span>
      </div>
    </div>
      <div id="ver" style="font-size:10px;color:var(--haze);opacity:.6;padding:10px 0 4px;text-align:right">версия 1.30</div>
  </div>
</div>

const tipFor=el=>{if(!el)return '';

  if(/^bank\d$/.test(id))return 'Пресет банка '+(+id.slice(4)+1)+': загрузить (после Save — сохранить сюда)';
  if(/^on\d$/.test(id))return 'Включить / выключить этот фрактал';
  if(/^slot\d$/.test(id))return 'Открыть настройки фрактала '+(+id.slice(4)+1);
  if(/^mode\d$/.test(id))return 'A — место выбирается само, M — ставишь сам тапом по картинке';
  if(/^cam\d$/.test(id))return 'Камера в эту ячейку';if(/^flip\d$/.test(id))return 'Следующая камера';if(/^del\d$/.test(id))return 'Убрать из ячейки';
  if(/^src\d$/.test(id))return 'Добавить фото или видео';if(/^act\d$/.test(id))return 'Сделать главной / включить слоем';
  if(/^tabon_/.test(id))return 'Включить этот эффект на картинке';if(/^tab_/.test(id))return 'Открыть настройки эффекта';
  const row=el.closest('.sl');if(row){const i=row.querySelector('input[type=range][id]');if(!i)return '';const rid=i.id;
    let m=rid.match(/^lamp2?_(\w+)$/);if(m)return TIPS['lamp:'+m[1]]||'';
    m=rid.match(/^px_(\w+)$/);if(m)return TIPS['px:'+m[1]]||'';

    m=rid.match(/^ca_(\w+)$/);if(m)return TIPS[(typeof TAB!=='undefined'?TAB:'ca')+':'+m[1]]||TIPS[m[1]]||'';

let pxSeed=0,pxBeat=-1;
function pxUniforms(t){const k=H/1080,bt=AU.on?AU.beat:Math.floor(t*bpm()/60);if(bt!==pxBeat){pxBeat=bt;pxSeed=(pxSeed+1)%997;}
  const react=PXV('beat')/100*(AU.on?(AU.lv[0]||0):0)*3,amp=1+react;

  gl.uniform4f(upx.A,PXV('cell')*k,PXV('adapt')/100,PXV('ratio')/100,PXV('gap')/100);
